services:
    web:
        image: ghcr.io/diaztmf/absensi-forista:latest
        restart: unless-stopped
        environment:
            CONTAINER_ROLE: web
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:-https://forista.klikhadir.my.id}
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: pgsql
            DB_HOST: mx2cv5uegvmvtoxe6rx2eqof
            DB_PORT: 5432
            DB_DATABASE: postgres
            DB_USERNAME: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            SESSION_SECURE_COOKIE: 'true'
            SESSION_DOMAIN: ${SESSION_DOMAIN:-forista.klikhadir.my.id}
            VAPID_SUBJECT: ${VAPID_SUBJECT}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
        ports:
            - '8080:8080'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/up']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s

    worker:
        image: ghcr.io/diaztmf/absensi-forista:latest
        restart: unless-stopped
        environment:
            CONTAINER_ROLE: worker
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:-https://forista.klikhadir.my.id}
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: pgsql
            DB_HOST: mx2cv5uegvmvtoxe6rx2eqof
            DB_PORT: 5432
            DB_DATABASE: postgres
            DB_USERNAME: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            SESSION_DOMAIN: ${SESSION_DOMAIN:-forista.klikhadir.my.id}
            VAPID_SUBJECT: ${VAPID_SUBJECT}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}

    scheduler:
        image: ghcr.io/diaztmf/absensi-forista:latest
        restart: unless-stopped
        environment:
            CONTAINER_ROLE: scheduler
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: ${APP_URL:-https://forista.klikhadir.my.id}
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: pgsql
            DB_HOST: mx2cv5uegvmvtoxe6rx2eqof
            DB_PORT: 5432
            DB_DATABASE: postgres
            DB_USERNAME: postgres
            DB_PASSWORD: ${DB_PASSWORD}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            SESSION_DOMAIN: ${SESSION_DOMAIN:-forista.klikhadir.my.id}
            VAPID_SUBJECT: ${VAPID_SUBJECT}
            VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
            VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
